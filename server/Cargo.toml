[package]
name = "clipsync-server"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
argon2 = "0.5"
rand = "0.8"
hex = "0.4"
anyhow = "1"
hmac = "0.12"
base64 = "0.22"
rust-embed = "8"

# Windows 服务支持（仅在 Windows 编译时启用；非 Windows 目标忽略）
[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
