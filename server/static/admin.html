<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ClipSync 管理后台</title>
<style>
  :root{
    --bg:#0f1320; --panel:#1a2030; --line:#2a3245; --text:#e6e9ef; --muted:#9aa4b8;
    --accent:#5b8cff; --red:#ff6b6b; --green:#37c98b; --amber:#f0b429;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC",sans-serif;
       background:var(--bg); color:var(--text); padding:24px;}
  h1{font-size:20px;margin:0 0 16px}
  h2{font-size:15px;margin:18px 0 8px;color:var(--muted)}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
  input{background:#0d111c;border:1px solid var(--line);color:var(--text);padding:9px 11px;border-radius:8px;font-size:14px;outline:none}
  input:focus{border-color:var(--accent)}
  button{background:var(--accent);color:#fff;border:none;padding:9px 14px;border-radius:8px;font-size:13px;cursor:pointer}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
  button.danger{background:var(--red)}
  button.green{background:var(--green)}
  button:disabled{opacity:.5;cursor:not-allowed}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:500}
  .tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px}
  .tag.on{background:rgba(55,201,139,.18);color:var(--green)}
  .tag.off{background:rgba(240,180,41,.18);color:var(--amber)}
  .tag.offline{background:rgba(154,164,184,.18);color:var(--muted)}
  #login{display:none;max-width:360px;margin:60px auto}
  #app{display:none}
  .muted{color:var(--muted);font-size:12px}
  .token-box{background:#0d111c;border:1px dashed var(--accent);border-radius:8px;padding:10px;margin-top:8px;word-break:break-all;font-family:monospace}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#000d;padding:10px 16px;border-radius:8px;display:none}
  .hidden{display:none}
</style>
</head>
<body>
  <!-- 登录 -->
  <div id="login">
    <h1>ClipSync 管理后台</h1>
    <div class="panel">
      <div class="row" style="flex-direction:column;align-items:stretch">
        <input id="u" placeholder="用户名" style="margin-bottom:8px"/>
        <input id="p" type="password" placeholder="密码" style="margin-bottom:12px"/>
        <button id="loginBtn">登录</button>
      </div>
      <div id="loginErr" class="muted" style="color:var(--red);margin-top:8px"></div>
    </div>
  </div>

  <!-- 主界面 -->
  <div id="app">
    <div class="row" style="justify-content:space-between">
      <h1>ClipSync 管理后台</h1>
      <div class="row">
        <button class="ghost" id="logout">退出登录</button>
      </div>
    </div>

    <div class="panel">
      <div class="row" style="justify-content:space-between">
        <h2 style="margin:0">网络</h2>
        <button id="newNet">+ 创建网络</button>
      </div>
      <div id="netList" class="muted" style="margin-top:8px">加载中…</div>
      <div id="newNetPanel" class="hidden" style="margin-top:12px">
        <div class="row" style="align-items:flex-end">
          <div><div class="muted" style="margin-bottom:4px">名称</div><input id="netName" placeholder="如 My Network"/></div>
          <div><div class="muted" style="margin-bottom:4px">描述（可选）</div><input id="netDesc" placeholder=""/></div>
          <button id="createNet">创建</button>
        </div>
        <div id="newToken" class="token-box hidden"></div>
        <div class="muted">⚠️ Token 仅在此显示一次，请妥善保存发给客户端。</div>
      </div>
    </div>

    <div class="panel" id="devPanel" style="display:none">
      <h2 id="devTitle">设备</h2>
      <div id="devList" class="muted">加载中…</div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

<script>
const $ = (s)=>document.querySelector(s);
let token = localStorage.getItem('cs_admin_token') || '';
let currentNet = null;

function toast(msg){const t=$('#toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',2500);}
function authHeaders(){return {'Content-Type':'application/json','Authorization':'Bearer '+token};}

async function api(path, opts={}){
  const res = await fetch(path, Object.assign({headers:authHeaders()}, opts));
  if(res.status===401){ logout(); throw new Error('unauthorized'); }
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error||('HTTP '+res.status));
  return data;
}

async function loadNetworks(){
  const {networks} = await api('/api/admin/networks');
  const box = $('#netList');
  if(!networks.length){ box.innerHTML='<span class="muted">暂无网络，请创建。</span>'; return; }
  let html='<table><thead><tr><th>名称</th><th>节点</th><th>已启用</th><th>创建</th><th></th></tr></thead><tbody>';
  for(const n of networks){
    html+=`<tr><td>${esc(n.name)}</td><td>${n.node_count}</td><td>${n.enabled_count}</td><td class="muted">${new Date(n.created*1000).toLocaleDateString()}</td><td><button class="ghost" onclick="showDevices('${n.id}','${esc(n.name)}')">查看设备</button></td></tr>`;
  }
  html+='</tbody></table>';
  box.innerHTML=html;
}

function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

async function showDevices(netId, name){
  currentNet = netId;
  $('#devPanel').style.display='block';
  $('#devTitle').textContent='设备 · '+name;
  const {nodes} = await api('/api/admin/networks/'+netId+'/devices');
  const box=$('#devList');
  if(!nodes.length){ box.innerHTML='<span class="muted">暂无设备连接。客户端填入 Token 后会以「未启用」出现在此。</span>'; return; }
  let html='<table><thead><tr><th>设备</th><th>平台</th><th>LAN</th><th>文件地址</th><th>状态</th><th></th></tr></thead><tbody>';
  for(const d of nodes){
    const status = !d.online ? '<span class="tag offline">离线</span>'
      : (d.enabled ? '<span class="  tag on">已启用</span>' : '<span class="tag off">未启用</span>');
    const btn = d.enabled
      ? `<button class="danger" onclick="setEnabled('${netId}','${d.device_id}',false)">禁用</button>`
      : `<button class="green" onclick="setEnabled('${netId}','${d.device_id}',true)">启用</button>`;
    html+=`<tr><td>${esc(d.name)}<div class="muted">${esc(d.device_id)}</div></td><td>${esc(d.platform)}</td><td>${esc(d.lan_group)}</td><td class="muted">${esc(d.ext_file_ep)||'-'}</td><td>${status}</td><td>${btn}</td></tr>`;
  }
  html+='</tbody></table>';
  box.innerHTML=html;
}

async function setEnabled(netId, devId, enabled){
  const action = enabled?'enable':'disable';
  await api(`/api/admin/networks/${netId}/devices/${devId}/${action}`, {method:'POST'});
  toast(enabled?'已启用':'已禁用');
  await showDevices(netId, $('#devTitle').textContent.replace('设备 · ',''));
}

$('#newNet').onclick=()=>{ $('#newNetPanel').classList.toggle('hidden'); };
$('#createNet').onclick=async()=>{
  const name=$('#netName').value.trim();
  if(!name){ toast('请输入名称'); return; }
  const r = await api('/api/admin/networks',{method:'POST',body:JSON.stringify({name, description:$('#netDesc').value})});
  $('#newToken').classList.remove('hidden');
  $('#newToken').textContent='Token（仅显示一次）：'+r.token;
  $('#netName').value=''; $('#netDesc').value='';
  await loadNetworks();
};
$('#loginBtn').onclick=async()=>{
  try{
    const r = await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({user:$('#u').value,pass:$('#p').value})});
    const d = await r.json();
    if(!r.ok){ $('#loginErr').textContent=d.error||'登录失败'; return; }
    token=d.token; localStorage.setItem('cs_admin_token',token); enterApp();
  }catch(e){ $('#loginErr').textContent='网络错误'; }
};
$('#logout').onclick=()=>{ logout(); };

function logout(){ token=''; localStorage.removeItem('cs_admin_token'); $('#app').style.display='none'; $('#login').style.display='block'; }
function enterApp(){ $('#login').style.display='none'; $('#app').style.display='block'; loadNetworks(); }

(async()=>{
  if(!token){ $('#login').style.display='block'; return; }
  try{ await loadNetworks(); enterApp(); }
  catch(e){ $('#login').style.display='block'; }
})();
</script>
</body>
</html>
