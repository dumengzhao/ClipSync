<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ClipSync 管理后台</title>
<style>
  :root{
    --bg:#0f1320; --panel:#1a2030; --line:#2a3245; --text:#e6e9ef; --muted:#9aa4b8;
    --accent:#5b8cff; --red:#ff6b6b; --green:#37c98b; --amber:#f0b429;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC",sans-serif;
       background:var(--bg); color:var(--text); padding:24px;}
  h1{font-size:20px;margin:0 0 16px}
  h2{font-size:15px;margin:18px 0 8px;color:var(--muted)}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
  input{background:#0d111c;border:1px solid var(--line);color:var(--text);padding:9px 11px;border-radius:8px;font-size:14px;outline:none}
  input:focus{border-color:var(--accent)}
  button{background:var(--accent);color:#fff;border:none;padding:9px 14px;border-radius:8px;font-size:13px;cursor:pointer}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
  button.danger{background:var(--red)}
  button.green{background:var(--green)}
  button:disabled{opacity:.5;cursor:not-allowed}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:500}
  .tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px}
  .tag.on{background:rgba(55,201,139,.18);color:var(--green)}
  .tag.off{background:rgba(240,180,41,.18);color:var(--amber)}
  .tag.offline{background:rgba(154,164,184,.18);color:var(--muted)}
  #login{display:none;max-width:360px;margin:60px auto}
  #app{display:none}
  .muted{color:var(--muted);font-size:12px}
  .token-box{background:#0d111c;border:1px dashed var(--accent);border-radius:8px;padding:10px;margin-top:8px;word-break:break-all;font-family:monospace}
  .tok{display:flex;gap:6px;align-items:center}
  .tok-val{background:#0d111c;border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:12px;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tokbtn{padding:5px 9px;font-size:12px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#000d;padding:10px 16px;border-radius:8px;display:none}
  .hidden{display:none}
  .dev-name{font-weight:600;font-size:14px;line-height:1.3}
  .uid{font-family:monospace;font-size:11px;color:var(--muted);background:#0d111c;border:1px solid var(--line);border-radius:5px;padding:2px 6px;display:inline-block;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .small{font-size:12px}
</style>
</head>
<body>
  <!-- 登录 -->
  <div id="login">
    <h1>ClipSync 管理后台</h1>
    <div class="panel">
      <div class="row" style="flex-direction:column;align-items:stretch">
        <input id="u" placeholder="用户名" style="margin-bottom:8px"/>
        <input id="p" type="password" placeholder="密码" style="margin-bottom:12px"/>
        <button id="loginBtn">登录</button>
      </div>
      <div id="loginErr" class="muted" style="color:var(--red);margin-top:8px"></div>
    </div>
  </div>

  <!-- 主界面 -->
  <div id="app">
    <div class="row" style="justify-content:space-between">
      <h1>ClipSync 管理后台</h1>
      <div class="row">
        <button class="ghost" id="logout">退出登录</button>
      </div>
    </div>

    <div class="panel">
      <div class="row" style="justify-content:space-between">
        <h2 style="margin:0">网络</h2>
        <button id="newNet">+ 创建网络</button>
      </div>
      <div id="netList" class="muted" style="margin-top:8px">加载中…</div>
      <div id="newNetPanel" class="hidden" style="margin-top:12px">
        <div class="row" style="align-items:flex-end">
          <div><div class="muted" style="margin-bottom:4px">名称</div><input id="netName" placeholder="如 My Network"/></div>
          <div><div class="muted" style="margin-bottom:4px">描述（可选）</div><input id="netDesc" placeholder=""/></div>
          <button id="createNet">创建</button>
        </div>
        <div id="newToken" class="token-box hidden"></div>
        <div class="muted">⚠️ Token 已持久化保存，可在下方网络列表中随时 👁 查看并 📋 复制。</div>
      </div>
    </div>

    <div class="panel" id="devPanel" style="display:none">
      <h2 id="devTitle">设备</h2>
      <div id="devList" class="muted">加载中…</div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

<script>
const $ = (s)=>document.querySelector(s);
let token = localStorage.getItem('cs_admin_token') || '';
let currentNet = null;
let _netAutoExpanded = false; // 仅首次加载网络列表时默认展开第一个网络的设备列表

function toast(msg){const t=$('#toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',2500);}
function authHeaders(){return {'Content-Type':'application/json','Authorization':'Bearer '+token};}

async function api(path, opts={}){
  const res = await fetch(path, Object.assign({headers:authHeaders()}, opts));
  if(res.status===401){ logout(); throw new Error('unauthorized'); }
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error||('HTTP '+res.status));
  return data;
}

async function loadNetworks(){
  const {networks} = await api('/api/admin/networks');
  const box = $('#netList');
  if(!networks.length){ box.innerHTML='<span class="muted">暂无网络，请创建。</span>'; return; }
  let html='<table><thead><tr><th>名称</th><th>节点</th><th>已启用</th><th>Token</th><th>创建</th><th></th></tr></thead><tbody>';
  for(const n of networks){
    const tok = n.token || '';
    const tokCell = tok
      ? `<div class="tok"><code id="tok-${n.id}" class="tok-val" data-token="${esc(tok)}">••••••••••••••••</code>`+
        `<button class="ghost tokbtn" title="显示/隐藏" onclick="toggleTok('${n.id}')">👁</button>`+
        `<button class="ghost tokbtn hidden" id="copy-${n.id}" onclick="copyFrom('tok-${n.id}')">📋 复制</button></div>`
      : '<span class="muted">（旧网络无 Token，请重新创建）</span>';
    html+=`<tr><td>${esc(n.name)}</td><td>${n.node_count}</td><td>${n.enabled_count}</td><td>${tokCell}</td><td class="muted">${new Date(n.created*1000).toLocaleDateString()}</td><td><button class="ghost" onclick="showDevices('${n.id}','${esc(n.name)}')">查看设备</button></td></tr>`;
  }
  html+='</tbody></table>';
  box.innerHTML=html;
  // 默认展开第一个网络的设备列表（仅首次加载时自动展开，避免创建网络后覆盖当前查看）
  if(!_netAutoExpanded && networks.length){
    _netAutoExpanded = true;
    showDevices(networks[0].id, networks[0].name);
  }
}

function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

// Token 眼睛：默认星号，点一下显示明文并露出复制按钮，再点隐藏
function toggleTok(id){
  const el=document.getElementById('tok-'+id);
  const copy=document.getElementById('copy-'+id);
  if(!el) return;
  if(el.dataset.shown==='1'){
    el.textContent='••••••••••••••••';
    el.dataset.shown='0';
    if(copy) copy.classList.add('hidden');
  }else{
    el.textContent=el.dataset.token||el.textContent;
    el.dataset.shown='1';
    if(copy) copy.classList.remove('hidden');
  }
}
// 复制按钮：从元素的 data-token 取明文复制（优先），失败回退 execCommand
async function copyFrom(elId){
  const el=document.getElementById(elId);
  if(!el) return;
  const t=el.dataset.token||el.textContent;
  try{
    await navigator.clipboard.writeText(t);
    toast('Token 已复制到剪贴板');
  }catch(e){
    try{
      const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove(); toast('Token 已复制到剪贴板');
    }catch(_){ toast('复制失败，请手动选择复制'); }
  }
}

function osLabel(p){
  return ({windows:'Windows',macos:'macOS',linux:'Linux',android:'Android',ios:'iOS'})[(p||'').toLowerCase()] || p || '未知';
}

let _devTimer=null;
function refreshDevicesNow(){
  if(!currentNet) return;
  const nm=$('#devTitle').textContent.replace('设备 · ','');
  showDevices(currentNet, nm);
}

async function showDevices(netId, name){
  currentNet = netId;
  $('#devPanel').style.display='block';
  $('#devTitle').textContent='设备 · '+name;
  const {nodes} = await api('/api/admin/networks/'+netId+'/devices');
  const box=$('#devList');
  if(!nodes.length){ box.innerHTML='<span class="muted">暂无设备连接。客户端填入 Token 后会以「未启用」出现在此。</span>'; return; }
  // 在线优先、再按名称排序，便于一眼看清谁在线
  nodes.sort((a,b)=> (b.online?1:0)-(a.online?1:0) || (a.name||'').localeCompare(b.name||''));
  let html='<table><thead><tr><th>计算机名 / 操作系统</th><th>唯一 ID</th><th>LAN 分组</th><th>文件地址</th><th>状态</th><th>操作</th></tr></thead><tbody>';
  for(const d of nodes){
    const uid = d.hardware_id || d.device_id; // 硬件指纹优先，回退软件 UUID
    const status = !d.online ? '<span class="tag offline">● 离线</span>'
      : (d.enabled ? '<span class="tag on">● 在线 · 已启用</span>' : '<span class="tag off">● 在线 · 未启用</span>');
    const btn = d.enabled
      ? `<button class="danger" onclick="setEnabled('${netId}','${d.device_id}',false)">禁用</button>`
      : `<button class="green" onclick="setEnabled('${netId}','${d.device_id}',true)">启用</button>`;
    const delBtn = `<button class="ghost" title="从网络移除该设备" onclick="removeDevice('${netId}','${d.device_id}')">删除</button>`;
    html+=`<tr>
      <td><div class="dev-name">🖥 ${esc(d.name||'(未命名)')}</div><div class="muted small">${esc(osLabel(d.platform))}</div></td>
      <td><code class="uid" title="设备唯一标识（硬件指纹优先）">${esc(uid)}</code></td>
      <td>${esc(d.lan_group)||'-'}</td>
      <td class="muted">${esc(d.ext_file_ep)||'-'}</td>
      <td>${status}</td>
      <td>${btn} ${delBtn}</td>
    </tr>`;
  }
  html+='</tbody></table>';
  box.innerHTML=html;
  if(_devTimer) clearInterval(_devTimer);
  _devTimer=setInterval(refreshDevicesNow, 5000); // 自动刷新，实时反映在线/离线
}

async function removeDevice(netId, devId){
  if(!confirm('确定从网络移除该设备？\n移除后该设备将不再显示，且需重新配对才能再次加入。')) return;
  try{
    const r = await api(`/api/admin/networks/${netId}/devices/${devId}/remove`, {method:'POST'});
    if(r && r.error){ toast('移除失败: '+r.error); return; }
    toast('已移除设备');
    await showDevices(netId, $('#devTitle').textContent.replace('设备 · ',''));
  }catch(e){ toast('移除失败: '+e.message); }
}

async function setEnabled(netId, devId, enabled){
  const action = enabled?'enable':'disable';
  await api(`/api/admin/networks/${netId}/devices/${devId}/${action}`, {method:'POST'});
  toast(enabled?'已启用':'已禁用');
  await showDevices(netId, $('#devTitle').textContent.replace('设备 · ',''));
}

$('#newNet').onclick=()=>{ $('#newNetPanel').classList.toggle('hidden'); };
$('#createNet').onclick=async()=>{
  const name=$('#netName').value.trim();
  if(!name){ toast('请输入名称'); return; }
  const r = await api('/api/admin/networks',{method:'POST',body:JSON.stringify({name, description:$('#netDesc').value})});
  $('#newToken').classList.remove('hidden');
  $('#newToken').innerHTML = `<div class="tok"><code id="newtok" class="tok-val" data-token="${esc(r.token)}">${esc(r.token)}</code><button class="ghost tokbtn" onclick="copyFrom('newtok')">📋 复制</button></div>`;
  $('#netName').value=''; $('#netDesc').value='';
  await loadNetworks();
};
$('#loginBtn').onclick=async()=>{
  try{
    const r = await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({user:$('#u').value,pass:$('#p').value})});
    const d = await r.json();
    if(!r.ok){ $('#loginErr').textContent=d.error||'登录失败'; return; }
    token=d.token; localStorage.setItem('cs_admin_token',token); enterApp();
  }catch(e){ $('#loginErr').textContent='网络错误'; }
};
$('#logout').onclick=()=>{ logout(); };

function logout(){ token=''; localStorage.removeItem('cs_admin_token'); $('#app').style.display='none'; $('#login').style.display='block'; }
function enterApp(){ $('#login').style.display='none'; $('#app').style.display='block'; loadNetworks(); }

(async()=>{
  if(!token){ $('#login').style.display='block'; return; }
  try{ await loadNetworks(); enterApp(); }
  catch(e){ $('#login').style.display='block'; }
})();
</script>
</body>
</html>
