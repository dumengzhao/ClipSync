name: Release

on:
  push:
    tags: ['v*']
  # 手动触发（试跑用）：必须给 tag 输入——手动触发时 github.ref_name 是分支名（main），
  # 直接用它会把 Release 建在错误的 tag 上。已有该 tag 就构建它，没有就在当前 ref 上创建。
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（形如 v0.3.1，须与包内版本一致）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # 廉价的前置校验：tag 与包内三处版本必须一致，否则不该烧 3 个平台的打包时间。
  # 不一致时的典型后果：Release 标题写 v0.4.0，而安装包文件名与客户端自动更新比较的
  # version 仍是 0.3.1 —— 用户更新链路会静默错乱。
  verify-version:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches app version
        env:
          # push tag → github.ref_name 即 tag；手动触发 → 取输入
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          want="${TAG#v}"
          conf=$(python3 -c "import json;print(json.load(open('client/src-tauri/tauri.conf.json'))['version'])")
          crate=$(awk '/^\[package\]/{f=1;next} /^\[/{f=0} f && /^version *=/{gsub(/[",]/,"");print $3; exit}' client/src-tauri/Cargo.toml)
          pkg=$(python3 -c "import json;print(json.load(open('client/package.json'))['version'])")
          echo "tag=$TAG → 期望版本 $want"
          echo "  tauri.conf.json = $conf"
          echo "  Cargo.toml      = $crate"
          echo "  package.json    = $pkg"
          fail=0
          [ "$want" = "$conf" ]  || { echo "::error::tag 与 tauri.conf.json 的 version 不一致"; fail=1; }
          [ "$want" = "$crate" ] || { echo "::error::tag 与 src-tauri/Cargo.toml 的 version 不一致"; fail=1; }
          [ "$want" = "$pkg" ]   || { echo "::error::tag 与 client/package.json 的 version 不一致"; fail=1; }
          exit $fail

  release:
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "client/src-tauri -> target"
          key: ${{ matrix.target }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: client
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: 'ClipSync ${{ inputs.tag || github.ref_name }}'
          releaseBody: |
            ## 下载说明

            ### macOS
            首次打开会提示「未验证开发者」，请：
            1. 右键点击应用 -> 「打开」-> 「打开」
            2. 或终端执行：`xattr -dr com.apple.quarantine /Applications/ClipSync.app`

            ### Windows
            首次运行会看到 SmartScreen 警告，点击「更多信息」->「仍要运行」。

            ### Linux
            AppImage 直接运行；deb/rpm 用对应包管理器安装。

            ### 完整性校验
            下载 SHA256SUMS 文件，执行 `shasum -a 256 -c SHA256SUMS-*.txt` 校验。
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Generate SHA256 checksums
        if: always()
        working-directory: .
        shell: bash
        run: |
          cd client/src-tauri/target
          find . -type f \( -name "*.dmg" -o -name "*.msi" -o -name "*-setup.exe" \
            -o -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" \) \
            -exec shasum -a 256 {} \; > SHA256SUMS-${{ matrix.label }}.txt || true
          cat SHA256SUMS-${{ matrix.label }}.txt || true

      - name: Upload checksums
        if: always()
        uses: softprops/action-gh-release@v3
        with:
          files: client/src-tauri/target/SHA256SUMS-${{ matrix.label }}.txt
