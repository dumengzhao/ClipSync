name: Release

on:
  push:
    tags: ['v*']
  # 手动触发（试跑用）：必须给 tag 输入——手动触发时 github.ref_name 是分支名（main），
  # 直接用它会把 Release 建在错误的 tag 上。已有该 tag 就构建它，没有就在当前 ref 上创建。
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（形如 v0.3.1，须与包内版本一致）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # 廉价前置判断：**这次到底要不要构建**。
  #
  # 为什么需要它：在 GitHub 上点「Publish release」时，若该 tag 的 ref 还不存在，
  # GitHub 会在这一刻才创建 tag；而「创建 tag」属于 push 事件 → 会把本工作流
  # **再触发一次**。那次运行检出的是 **tag 指向的那个提交**，而它往往不是你以为的
  # 最新提交（草稿是更早的运行创建的 ⇒ tag 就指向那个旧提交）。
  # 后果：用旧代码重建、把 Release 上已经好的资产**覆盖**掉；若中途失败，还会留下
  # 「资产已更新、latest.json 没更新」的不一致 → 两端 sha256 校验必然失败。
  # （2026-09-24 实踩：run #6 就是这样把 run #5 的成果毁掉的。）
  guard:
    name: decide whether to build
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # 人工触发 = 明确意图（就是要重建）→ 永远构建
          if [ "$EVENT" != "push" ]; then
            echo "人工触发（$EVENT）→ 按意图构建"
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # tag 事件：该 tag 的 Release 若已存在且**已发布**，说明本次是
          # 「Publish 草稿」自动创建 tag 引起的二次触发 → 跳过，别覆盖已发布的资产。
          draft=$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null || echo missing)
          case "$draft" in
            false)
              echo "::notice::tag $TAG 的 Release 已发布 —— 本次为 Publish 触发 tag 创建引起的二次运行，跳过重复构建，保留现有资产与 latest.json"
              echo "build=false" >> "$GITHUB_OUTPUT"
              ;;
            true)
              echo "tag $TAG 的 Release 仍是草稿 → 正常构建"
              echo "build=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "tag $TAG 还没有 Release → 正常构建"
              echo "build=true" >> "$GITHUB_OUTPUT"
              ;;
          esac

  # 廉价的前置校验：tag 与包内三处版本必须一致，否则不该烧 3 个平台的打包时间。
  # 不一致时的典型后果：Release 标题写 v0.4.0，而安装包文件名与客户端自动更新比较的
  # version 仍是 0.3.1 —— 用户更新链路会静默错乱。
  verify-version:
    needs: [guard]
    if: needs.guard.outputs.build == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches app version
        env:
          # push tag → github.ref_name 即 tag；手动触发 → 取输入
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          want="${TAG#v}"
          conf=$(python3 -c "import json;print(json.load(open('client/src-tauri/tauri.conf.json'))['version'])")
          crate=$(awk '/^\[package\]/{f=1;next} /^\[/{f=0} f && /^version *=/{gsub(/[",]/,"");print $3; exit}' client/src-tauri/Cargo.toml)
          pkg=$(python3 -c "import json;print(json.load(open('client/package.json'))['version'])")
          echo "tag=$TAG → 期望版本 $want"
          echo "  tauri.conf.json = $conf"
          echo "  Cargo.toml      = $crate"
          echo "  package.json    = $pkg"
          fail=0
          [ "$want" = "$conf" ]  || { echo "::error::tag 与 tauri.conf.json 的 version 不一致"; fail=1; }
          [ "$want" = "$crate" ] || { echo "::error::tag 与 src-tauri/Cargo.toml 的 version 不一致"; fail=1; }
          [ "$want" = "$pkg" ]   || { echo "::error::tag 与 client/package.json 的 version 不一致"; fail=1; }
          exit $fail

  release:
    name: release (${{ matrix.label }})
    needs: [guard, verify-version]
    if: needs.guard.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
            platform: linux-x86_64
            # rpm 需要 rpmbuild，runner 上没装，因此不发 rpm
            bundles: deb,appimage
            extra_args: ''
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
            platform: darwin-aarch64
            bundles: app,dmg
            # CI 上没有本地那套 "ClipSync Dev" 证书，不覆盖会直接失败
            # （Signing with identity "ClipSync Dev" → no identity found）→ 显式用 ad-hoc 身份 "-"
            extra_args: --config {"bundle":{"macOS":{"signingIdentity":"-"}}}
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
            platform: windows-x86_64
            # 只发 NSIS：MSI 安装会绕过 installer.nsh，自更新入口会失效
            bundles: nsis
            extra_args: ''
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "client/src-tauri -> target"
          key: ${{ matrix.target }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: client
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: 'ClipSync ${{ inputs.tag || github.ref_name }}'
          releaseBody: |
            ## 下载说明

            ### macOS
            首次打开会提示「未验证开发者」，请：
            1. 右键点击应用 -> 「打开」-> 「打开」
            2. 或终端执行：`xattr -dr com.apple.quarantine /Applications/ClipSync.app`

            ### Windows
            首次运行会看到 SmartScreen 警告，点击「更多信息」->「仍要运行」。

            ### Linux
            AppImage 直接运行；deb 用对应包管理器安装。

            ### 完整性校验
            下载 SHA256SUMS 文件，执行 `shasum -a 256 -c SHA256SUMS-*.txt` 校验。
          releaseDraft: true
          prerelease: false
          # 必须显式给 --bundles：tauri.conf.json 的 targets 是 ["nsis","app"]，
          # 这两个在 Linux 上都不适用 → 一个产物都打不出来（曾导致 Linux job 报
          # "No artifacts were found."，macOS 也因此只出 .app）
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} ${{ matrix.extra_args }}

      - name: Generate SHA256 checksums
        if: success()
        working-directory: .
        shell: bash
        run: |
          cd client/src-tauri/target
          # shasum 来自 Perl（macOS / Linux 有），Windows 的 Git Bash 没有它、但有 sha256sum。
          # 踩过：缺回退时 find -exec shasum 会静默失败 → 生成 0 字节文件 →
          # 上传时 GitHub 报 `HTTP 400: Bad Content-Length`。
          if command -v shasum >/dev/null 2>&1; then HASH="shasum -a 256"; else HASH="sha256sum"; fi
          find . -type f \( -name "*.dmg" -o -name "*-setup.exe" \
            -o -name "*.AppImage" -o -name "*.deb" \) \
            -exec $HASH {} \; > SHA256SUMS-${{ matrix.label }}.txt
          cat SHA256SUMS-${{ matrix.label }}.txt
          # 空文件 = 没匹配到产物或哈希命令不可用，必须响亮失败（别静默上传空文件）
          if [ ! -s "SHA256SUMS-${{ matrix.label }}.txt" ]; then
            echo "::error::SHA256SUMS-${{ matrix.label }}.txt 为空（未匹配到产物，或哈希命令不可用）"
            exit 1
          fi

      - name: Upload checksums
        if: success()
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 不用 softprops/action-gh-release：它走 PATCH update-a-release，在本仓库一直
        # 返回 403 "Resource not accessible by integration"；而 tauri-action 走的是
        # 资产上传接口（同一份权限）且一直成功，故改用同路径的 gh release upload。
        # 手动触发时当前 ref 不是 tag，必须显式给 tag 名。
        run: gh release upload "${{ inputs.tag || github.ref_name }}" "client/src-tauri/target/SHA256SUMS-${{ matrix.label }}.txt" --clobber

      # 产出**本平台**的更新清单片段：{platform, file, sha256}
      # 跨平台汇总必须在一个 job 里做 → 交给后面的 manifest job。
      - name: Write platform manifest fragment
        if: success()
        working-directory: .
        shell: bash
        # 双保险：脚本内部也会把标准流切成 UTF-8，这里再显式声明一次环境变量。
        # （Windows 控制台默认 cp1252，打印中文会让 Python 直接以退出码 1 退出 ✗）
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          echo "使用 Python 解释器: $PY"
          "$PY" tools/make-manifest-fragment.py \
            --platform "${{ matrix.platform }}" \
            --search-dir client/src-tauri/target \
            --out-dir client/src-tauri/target/manifest-fragment

      - name: Upload manifest fragment
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: manifest-fragment-${{ matrix.platform }}
          path: client/src-tauri/target/manifest-fragment/${{ matrix.platform }}.json
          if-no-files-found: error

  # 汇总各平台片段 → latest.json → 作为 **Release 资产** 上传。
  # 两条链路都读这个文件：
  #   客户端「检查更新 GitHub」→ https://github.com/<repo>/releases/latest/download/latest.json
  #   服务端「从 GitHub 拉取」 → 同上（再转存到自己的服务器，供 GitHub 不可达的客户端使用）
  # 注意：**草稿 Release 不生效**，必须先 Publish —— 与现有「草稿 → 手动发布」流程一致。
  manifest:
    name: publish latest.json
    needs: [guard, release]
    if: needs.guard.outputs.build == 'true'
    # 显式钉版本：`ubuntu-latest` 会在 2026-10-19 静默切到 Ubuntu 26（GitHub 已发 notice），
    # 与本仓其余 job 一致改用钉死的 LTS，避免「某天突然换了系统」影响清单生成。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          pattern: manifest-fragment-*
          path: fragments
          merge-multiple: true

      - name: Assemble latest.json
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          python3 tools/build-latest-json.py \
            --repo "${{ github.repository }}" \
            --tag "${{ inputs.tag || github.ref_name }}" \
            --fragments fragments \
            --out latest.json \
            --notes "ClipSync ${{ inputs.tag || github.ref_name }}（三平台安装包）"

      - name: Upload latest.json to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 与 checksum 上传同一条路径：gh release upload 在本仓库可用，
        # softprops/action-gh-release 走 PATCH update-a-release 会返回 403。
        run: gh release upload "${{ inputs.tag || github.ref_name }}" latest.json --clobber

  # 服务端 Linux musl 静态产物：与客户端安装包放在同一个 Release 里，部署时整目录拷过去即可。
  #
  # 为什么单独一个 job：
  #   1) 服务端**必须**是 musl 静态（零 .so 依赖，任意发行版都能跑）；
  #   2) 而 musl 静态的前提是**依赖树纯 Rust** —— 只要引入 ring/rustls/reqwest 这类含 C 代码的 crate，
  #      就需要 musl C 编译器，直接在 Windows 上交叉编译也会失败（2026-09-24 实测踩过）。
  #      所以这里加了一道门禁，把「有人不小心引入 C 依赖」挡在发布之前。
  server-musl:
    name: server (linux musl static)
    needs: [guard, release]
    if: needs.guard.outputs.build == 'true'
    # 同上：钉 LTS，别吃 `ubuntu-latest` 的静默迁移。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "server -> target"

      - name: 门禁：服务端依赖树不得含 C 依赖
        run: |
          cd server
          if cargo tree -p clipsync-server | grep -E "(^|[^a-z-])(ring|rustls|reqwest|aws-lc-rs|openssl)( |$| v)"; then
            echo "::error::服务端依赖树里出现了含 C 代码的依赖 —— 会毁掉 musl 静态构建，请改用纯 Rust 实现（例如 HTTP 走系统 curl）"
            exit 1
          fi
          echo "✓ 服务端依赖树保持纯 Rust"

      - name: 构建 musl 静态二进制
        run: |
          rustup target add x86_64-unknown-linux-musl
          cd server
          cargo build --release --target x86_64-unknown-linux-musl

      - name: 校验确实是静态链接（不看「编译成功」就算数）
        run: |
          BIN=server/target/x86_64-unknown-linux-musl/release/clipsync-server
          file "$BIN"
          ldd "$BIN" 2>&1 | tee /tmp/ldd.txt || true
          grep -q "statically linked" /tmp/ldd.txt || {
            echo "::error::产物不是静态链接 —— 拷到目标机会依赖 .so，拒绝上传"
            exit 1
          }
          grep -q "static-pie linked" <(file "$BIN") || echo "::warning::不是 static-pie（仍可用，但预期是 static-pie）"

      - name: 打包部署目录
        run: |
          cd server
          ./package.sh
          tar czf clipsync-server-linux.tar.gz -C dist clipsync-server-linux

      - name: 上传到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 与 checksum / latest.json 同一条路径（gh release upload 在本仓库可用）
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          cp server/target/x86_64-unknown-linux-musl/release/clipsync-server \
            /tmp/clipsync-server-linux-x86_64-musl
          gh release upload "$TAG" server/clipsync-server-linux.tar.gz --clobber
          gh release upload "$TAG" /tmp/clipsync-server-linux-x86_64-musl --clobber

  # 收尾自校验：**latest.json 必须与 Release 上真实存在的字节逐一对得上**。
  #
  # 为什么必须是「总是运行」的独立 job：它要覆盖两种时机 ——
  #   ① 正常发版：清单刚写进草稿就校验 → **在 Publish 之前**就把不一致挡出来；
  #   ② Publish 触发的那次二次运行：构建被 guard 跳过，只剩它能告诉你
  #      「刚发布的这份 Release 是坏的」。
  # 只看 Release 上的实际资产（不看构建产物），所以资产被谁覆盖过都躲不过。
  verify-manifest:
    name: verify release consistency
    needs: [guard, manifest]
    # always() 是有意的：manifest 被 guard 跳过时也必须跑，否则最该报警的场景反而静默。
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Verify latest.json against release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          python3 tools/verify-release-manifest.py \
            --repo "${{ github.repository }}" \
            --tag "${{ inputs.tag || github.ref_name }}"

