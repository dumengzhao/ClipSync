name: Release

on:
  push:
    tags: ['v*']
  # 手动触发（试跑用）：必须给 tag 输入——手动触发时 github.ref_name 是分支名（main），
  # 直接用它会把 Release 建在错误的 tag 上。已有该 tag 就构建它，没有就在当前 ref 上创建。
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（形如 v0.3.1，须与包内版本一致）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # 廉价的前置校验：tag 与包内三处版本必须一致，否则不该烧 3 个平台的打包时间。
  # 不一致时的典型后果：Release 标题写 v0.4.0，而安装包文件名与客户端自动更新比较的
  # version 仍是 0.3.1 —— 用户更新链路会静默错乱。
  verify-version:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches app version
        env:
          # push tag → github.ref_name 即 tag；手动触发 → 取输入
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          want="${TAG#v}"
          conf=$(python3 -c "import json;print(json.load(open('client/src-tauri/tauri.conf.json'))['version'])")
          crate=$(awk '/^\[package\]/{f=1;next} /^\[/{f=0} f && /^version *=/{gsub(/[",]/,"");print $3; exit}' client/src-tauri/Cargo.toml)
          pkg=$(python3 -c "import json;print(json.load(open('client/package.json'))['version'])")
          echo "tag=$TAG → 期望版本 $want"
          echo "  tauri.conf.json = $conf"
          echo "  Cargo.toml      = $crate"
          echo "  package.json    = $pkg"
          fail=0
          [ "$want" = "$conf" ]  || { echo "::error::tag 与 tauri.conf.json 的 version 不一致"; fail=1; }
          [ "$want" = "$crate" ] || { echo "::error::tag 与 src-tauri/Cargo.toml 的 version 不一致"; fail=1; }
          [ "$want" = "$pkg" ]   || { echo "::error::tag 与 client/package.json 的 version 不一致"; fail=1; }
          exit $fail

  release:
    name: release (${{ matrix.label }})
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
            platform: linux-x86_64
            # rpm 需要 rpmbuild，runner 上没装，因此不发 rpm
            bundles: deb,appimage
            extra_args: ''
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
            platform: darwin-aarch64
            bundles: app,dmg
            # CI 上没有本地那套 "ClipSync Dev" 证书，不覆盖会直接失败
            # （Signing with identity "ClipSync Dev" → no identity found）→ 显式用 ad-hoc 身份 "-"
            extra_args: --config {"bundle":{"macOS":{"signingIdentity":"-"}}}
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
            platform: windows-x86_64
            # 只发 NSIS：MSI 安装会绕过 installer.nsh，自更新入口会失效
            bundles: nsis
            extra_args: ''
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "client/src-tauri -> target"
          key: ${{ matrix.target }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: client
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: 'ClipSync ${{ inputs.tag || github.ref_name }}'
          releaseBody: |
            ## 下载说明

            ### macOS
            首次打开会提示「未验证开发者」，请：
            1. 右键点击应用 -> 「打开」-> 「打开」
            2. 或终端执行：`xattr -dr com.apple.quarantine /Applications/ClipSync.app`

            ### Windows
            首次运行会看到 SmartScreen 警告，点击「更多信息」->「仍要运行」。

            ### Linux
            AppImage 直接运行；deb 用对应包管理器安装。

            ### 完整性校验
            下载 SHA256SUMS 文件，执行 `shasum -a 256 -c SHA256SUMS-*.txt` 校验。
          releaseDraft: true
          prerelease: false
          # 必须显式给 --bundles：tauri.conf.json 的 targets 是 ["nsis","app"]，
          # 这两个在 Linux 上都不适用 → 一个产物都打不出来（曾导致 Linux job 报
          # "No artifacts were found."，macOS 也因此只出 .app）
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} ${{ matrix.extra_args }}

      - name: Generate SHA256 checksums
        if: success()
        working-directory: .
        shell: bash
        run: |
          cd client/src-tauri/target
          # shasum 来自 Perl（macOS / Linux 有），Windows 的 Git Bash 没有它、但有 sha256sum。
          # 踩过：缺回退时 find -exec shasum 会静默失败 → 生成 0 字节文件 →
          # 上传时 GitHub 报 `HTTP 400: Bad Content-Length`。
          if command -v shasum >/dev/null 2>&1; then HASH="shasum -a 256"; else HASH="sha256sum"; fi
          find . -type f \( -name "*.dmg" -o -name "*-setup.exe" \
            -o -name "*.AppImage" -o -name "*.deb" \) \
            -exec $HASH {} \; > SHA256SUMS-${{ matrix.label }}.txt
          cat SHA256SUMS-${{ matrix.label }}.txt
          # 空文件 = 没匹配到产物或哈希命令不可用，必须响亮失败（别静默上传空文件）
          if [ ! -s "SHA256SUMS-${{ matrix.label }}.txt" ]; then
            echo "::error::SHA256SUMS-${{ matrix.label }}.txt 为空（未匹配到产物，或哈希命令不可用）"
            exit 1
          fi

      - name: Upload checksums
        if: success()
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 不用 softprops/action-gh-release：它走 PATCH update-a-release，在本仓库一直
        # 返回 403 "Resource not accessible by integration"；而 tauri-action 走的是
        # 资产上传接口（同一份权限）且一直成功，故改用同路径的 gh release upload。
        # 手动触发时当前 ref 不是 tag，必须显式给 tag 名。
        run: gh release upload "${{ inputs.tag || github.ref_name }}" "client/src-tauri/target/SHA256SUMS-${{ matrix.label }}.txt" --clobber

      # 产出**本平台**的更新清单片段：{platform, file, sha256}
      # 跨平台汇总必须在一个 job 里做 → 交给后面的 manifest job。
      - name: Write platform manifest fragment
        if: success()
        working-directory: .
        shell: bash
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" tools/make-manifest-fragment.py \
            --platform "${{ matrix.platform }}" \
            --search-dir client/src-tauri/target \
            --out-dir client/src-tauri/target/manifest-fragment

      - name: Upload manifest fragment
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: manifest-fragment-${{ matrix.platform }}
          path: client/src-tauri/target/manifest-fragment/${{ matrix.platform }}.json
          if-no-files-found: error

  # 汇总各平台片段 → latest.json → 作为 **Release 资产** 上传。
  # 两条链路都读这个文件：
  #   客户端「检查更新 GitHub」→ https://github.com/<repo>/releases/latest/download/latest.json
  #   服务端「从 GitHub 拉取」 → 同上（再转存到自己的服务器，供 GitHub 不可达的客户端使用）
  # 注意：**草稿 Release 不生效**，必须先 Publish —— 与现有「草稿 → 手动发布」流程一致。
  manifest:
    name: publish latest.json
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          pattern: manifest-fragment-*
          path: fragments
          merge-multiple: true

      - name: Assemble latest.json
        run: |
          python3 tools/build-latest-json.py \
            --repo "${{ github.repository }}" \
            --tag "${{ inputs.tag || github.ref_name }}" \
            --fragments fragments \
            --out latest.json \
            --notes "ClipSync ${{ inputs.tag || github.ref_name }}（三平台安装包）"

      - name: Upload latest.json to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 与 checksum 上传同一条路径：gh release upload 在本仓库可用，
        # softprops/action-gh-release 走 PATCH update-a-release 会返回 403。
        run: gh release upload "${{ inputs.tag || github.ref_name }}" latest.json --clobber
