name: Nightly

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
            # rpm 需要 rpmbuild，runner 上没装，因此不发 rpm
            bundles: deb,appimage
            extra_args: ''
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
            bundles: app,dmg
            # CI 上没有本地那套 "ClipSync Dev" 证书，不覆盖会直接失败
            # （Signing with identity "ClipSync Dev" → no identity found）→ 显式用 ad-hoc 身份 "-"
            extra_args: --config {"bundle":{"macOS":{"signingIdentity":"-"}}}
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
            # 只发 NSIS：MSI 安装会绕过 installer.nsh，自更新入口会失效
            bundles: nsis
            extra_args: ''
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "client/src-tauri -> target"
          key: ${{ matrix.target }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - run: npm ci

      - name: Build Tauri app (unsigned)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: client
          tagName: nightly
          releaseName: 'Nightly Build'
          releaseBody: '自动夜间构建，未经签名，仅用于测试。'
          releaseDrafts: false
          prerelease: true
          # 必须显式给 --bundles：tauri.conf.json 的 targets 是 ["nsis","app"]，
          # 这两个在 Linux 上都不适用 → Linux 一个产物都打不出来、macOS 只出 .app
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} ${{ matrix.extra_args }}

      - name: Generate SHA256 checksums
        if: success()
        working-directory: .
        shell: bash
        run: |
          cd client/src-tauri/target
          find . -type f \( -name "*.dmg" -o -name "*-setup.exe" \
            -o -name "*.AppImage" -o -name "*.deb" \) \
            -exec shasum -a 256 {} \; > SHA256SUMS-${{ matrix.label }}.txt || true
          cat SHA256SUMS-${{ matrix.label }}.txt || true

      - name: Upload checksums
        if: success()
        uses: softprops/action-gh-release@v3
        with:
          # 定时/手动触发时当前 ref 不是 tag，不给 tag_name 该动作会直接报
          # "GitHub Releases requires a tag"
          tag_name: nightly
          files: client/src-tauri/target/SHA256SUMS-${{ matrix.label }}.txt
