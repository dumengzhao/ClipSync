name: Nightly

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
          - os: macos-14
            target: aarch64-apple-darwin
            label: macos-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            label: macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "client/src-tauri -> target"
          key: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - run: npm ci

      - name: Build Tauri app (unsigned)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          projectPath: client
          tagName: nightly
          releaseName: 'Nightly Build'
          releaseBody: '自动夜间构建，未经签名，仅用于测试。'
          releaseDrafts: false
          prerelease: true
          args: --target ${{ matrix.target }}

      - name: Generate SHA256 checksums
        if: always()
        working-directory: .
        shell: bash
        run: |
          cd client/src-tauri/target
          find . -type f \( -name "*.dmg" -o -name "*.msi" -o -name "*-setup.exe" \
            -o -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" \) \
            -exec shasum -a 256 {} \; > SHA256SUMS-${{ matrix.label }}.txt || true
          cat SHA256SUMS-${{ matrix.label }}.txt || true

      - name: Upload checksums
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          files: client/src-tauri/target/SHA256SUMS-${{ matrix.label }}.txt
