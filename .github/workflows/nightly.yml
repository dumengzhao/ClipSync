name: Nightly

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
            # rpm 需要 rpmbuild，runner 上没装，因此不发 rpm
            bundles: deb,appimage
            extra_args: ''
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
            bundles: app,dmg
            # CI 上没有本地那套 "ClipSync Dev" 证书，不覆盖会直接失败
            # （Signing with identity "ClipSync Dev" → no identity found）→ 显式用 ad-hoc 身份 "-"
            extra_args: --config {"bundle":{"macOS":{"signingIdentity":"-"}}}
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
            # 只发 NSIS：MSI 安装会绕过 installer.nsh，自更新入口会失效
            bundles: nsis
            extra_args: ''
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "client/src-tauri -> target"
          key: ${{ matrix.target }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - run: npm ci

      - name: Build Tauri app (unsigned)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: client
          tagName: nightly
          releaseName: 'Nightly Build'
          releaseBody: '自动夜间构建，未经签名，仅用于测试。'
          # 注意：tauri-action 的输入是单数 releaseDraft（默认就是 false）
          releaseDraft: false
          prerelease: true
          # 必须显式给 --bundles：tauri.conf.json 的 targets 是 ["nsis","app"]，
          # 这两个在 Linux 上都不适用 → Linux 一个产物都打不出来、macOS 只出 .app
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} ${{ matrix.extra_args }}

      - name: Generate SHA256 checksums
        if: success()
        working-directory: .
        shell: bash
        run: |
          cd client/src-tauri/target
          # shasum 来自 Perl（macOS / Linux 有），Windows 的 Git Bash 没有它、但有 sha256sum。
          # 踩过：缺回退时 find -exec shasum 会静默失败 → 生成 0 字节文件 →
          # 上传时 GitHub 报 `HTTP 400: Bad Content-Length`。
          if command -v shasum >/dev/null 2>&1; then HASH="shasum -a 256"; else HASH="sha256sum"; fi
          find . -type f \( -name "*.dmg" -o -name "*-setup.exe" \
            -o -name "*.AppImage" -o -name "*.deb" \) \
            -exec $HASH {} \; > SHA256SUMS-${{ matrix.label }}.txt
          cat SHA256SUMS-${{ matrix.label }}.txt
          # 空文件 = 没匹配到产物或哈希命令不可用，必须响亮失败（别静默上传空文件）
          if [ ! -s "SHA256SUMS-${{ matrix.label }}.txt" ]; then
            echo "::error::SHA256SUMS-${{ matrix.label }}.txt 为空（未匹配到产物，或哈希命令不可用）"
            exit 1
          fi

      - name: Upload checksums
        if: success()
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 不用 softprops/action-gh-release：它走 PATCH update-a-release，在本仓库一直
        # 返回 403 "Resource not accessible by integration"；而 tauri-action 走的是
        # 资产上传接口（同一份权限）且一直成功，故改用同路径的 gh release upload。
        run: gh release upload nightly "client/src-tauri/target/SHA256SUMS-${{ matrix.label }}.txt" --clobber
