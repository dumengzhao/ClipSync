[package]
name = "clipsync"
version = "0.1.0"
description = "Cross-platform clipboard sync tool"
authors = ["dumengzhao"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "clipsync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.0"
tauri-plugin-updater = "2.0"
tauri-plugin-shell = "2.0"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Crypto (cross-platform, pure Rust)
aes-gcm = "0.10"
x25519-dalek = "2"
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
spake2 = "0.4"
blake3 = "1"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }

# Network
tokio-tungstenite = "0.23"
mdns-sd = "0.11"

# Platform clipboard (will be replaced by native impl in phase 3)
arboard = "3"

# Cache
lru = "0.12"

# Utilities
async-trait = "0.1"
once_cell = "1"
parking_lot = "0.12"
crossbeam-channel = "0.5"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }

# Windows-specific
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_SystemServices",
    "Win32_System_Memory",
    "Win32_Security_Cryptography",
] }

# macOS-specific
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.2"
objc2-app-kit = { version = "0.2", features = ["NSPasteboard", "NSPasteboardItem", "NSApplication"] }
objc2-foundation = { version = "0.2", features = ["NSString", "NSData", "NSArray"] }
security-framework = "3"

# Linux-specific
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"
smithay-client-toolkit = { version = "0.18", optional = true }
dbus-secret-service = "4"

[features]
default = ["mdns", "image-sync"]
mdns = []
image-sync = []
wayland = ["dep:smithay-client-toolkit"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
