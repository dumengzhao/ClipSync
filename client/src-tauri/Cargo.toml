[package]
name = "clipsync"
version = "0.3.1"
description = "Cross-platform clipboard sync tool"
authors = ["dumengzhao"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "clipsync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-single-instance = "2"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Crypto (cross-platform, pure Rust)
aes-gcm = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets", "getrandom"] }
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
spake2 = { version = "0.4", features = ["getrandom"] }
blake3 = "1"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }

# Network
# rustls-tls-webpki-roots：启用 wss:// 支持（默认 features 不含 TLS，选 wss 会直接
# 报 "TLS support not compiled in"）。选 rustls 而非 native-tls：纯 Rust 实现，
# 三平台构建都不需要 OpenSSL 等原生依赖；信任锚用 Mozilla/webpki 根证书集，
# 公共 CA（Let's Encrypt 等）证书可直接通过校验。
# 注意：自签证书不在 webpki 根集合内，会校验失败——若需自签，改装 native-tls
# （走系统证书库，Windows/macOS 可把自签 CA 装进受信任根）或注入自定义 CA。
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-webpki-roots"] }
# tokio-rustls 以 default-features=false 引 rustls（不带加密后端），而 rustls 0.23 要求
# 进程级恰好选定一个 CryptoProvider，否则运行时 panic（"Could not automatically
# determine the process-level CryptoProvider"）。这里直接依赖 rustls 把 ring 后端
# 通过 feature 合并打开（ring 只需 C 工具链；aws-lc-rs 在 Windows 还要 NASM+CMake）。
# tls12 必须显式开启——default-features=false 时只支持 TLS 1.3，而不少 nginx 只开 1.2。
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
mdns-sd = "0.11"
if-addrs = "0.13"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["stream"] }

# Platform clipboard (will be replaced by native impl in phase 3)
arboard = "3"

# Cache
lru = "0.12"

# Utilities
async-trait = "0.1"
once_cell = "1"
parking_lot = "0.12"
crossbeam-channel = "0.5"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
gethostname = "0.5"

# Windows-specific
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_SystemServices",
    "Win32_System_Memory",
    "Win32_System_DataExchange",
    "Win32_Security_Cryptography",
    "Win32_Security_Credentials",
    # pull-toast 定位需要：MonitorFromWindow / GetMonitorInfoW / MONITORINFO（取显示器工作区）
    "Win32_Graphics_Gdi",
] }

# macOS-specific
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.2"
# NSWindow 类本身需要同时启用 NSResponder（NSWindow 继承自 NSResponder），
# 否则 objc2-app-kit 不会导出 NSWindow，只有 NSWindow* 相关常量可用。
objc2-app-kit = { version = "0.2", features = ["NSPasteboard", "NSPasteboardItem", "NSApplication", "NSWindow", "NSResponder"] }
objc2-foundation = { version = "0.2", features = ["NSString", "NSData", "NSArray"] }
security-framework = "3"

# Linux-specific
[target.'cfg(target_os = "linux")'.dependencies]
# xfixes：Linux 剪贴板「取得所有权」事件（识别同一文件重复复制，见 clipboard/linux.rs）
x11rb = { version = "0.13", features = ["xfixes"] }
smithay-client-toolkit = { version = "0.18", optional = true }
dbus-secret-service = { version = "4", features = ["crypto-rust"] }

[features]
default = ["mdns", "image-sync"]
mdns = []
image-sync = []
wayland = ["dep:smithay-client-toolkit"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# 开发构建提速：只生成行号表（不含完整调试信息），链接时间大幅缩短，
# panic 回溯仍能看到行号。发布构建不受影响（[profile.release] 独立配置）。
[profile.dev]
debug = "line-tables-only"
